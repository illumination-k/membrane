[workspace]
resolver = "3"
members = [
  "applications/research-agents",
  "examples",
  "membrane-core",
  "membrane-macros",
  "membrane-mcp",
  "membrane-openai",
  "membrane-plugin",
  "membrane-tools",
]

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
